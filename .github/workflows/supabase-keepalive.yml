name: Supabase keepalive

on:
  schedule:
    # Every 3 days at 03:17 UTC — well inside Supabase's 7-day pause window
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # needed to re-enable this workflow (see last step)

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install psycopg2-binary==2.9.10

      - name: Ping Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/supabase_keepalive.py

      # GitHub disables scheduled workflows in public repos after 60 days
      # without repo activity. Re-enabling via API keeps the schedule alive
      # without polluting git history with dummy commits.
      - name: Keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
